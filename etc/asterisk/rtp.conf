; /etc/asterisk/rtp.conf

[general]
; Port range for RTP streams. Twilio expects you to have a range open.
rtpstart=10000
rtpend=20000

; Whether to enable ICE/STUN for NAT traversal (off for simple setups).
icesupport=no

; Whether to enable symmetric RTP (recommended if behind NAT).
symmetric_rtp=yes

; Whether to enable RTP multiplexing (RTP/RTCP on same port).
rtcp_mux=no

; Optional: force codec sample rate handling
; This helps avoid "frequency mismatch" errors if files are wrong.
strictrtp=yes
