[from-twilio]
; Catch-all for any incoming call from Twilio SIP trunk
exten => +18669750444,1,NoOp(Inbound call from Twilio)
 same => n,Answer()
 same => n,System(/usr/bin/python3 /etc/asterisk/sce_phone_menu_handler.py status)
 ; Play outage if needed, but only once
 same => n,Playback(ongoing_outage)  ; will just skip if file doesn't exist
 ; Otherwise, go straight to hold music
 same => n(start_hold),StartMusicOnHold(default)
 same => n,Set(TIMEOUT(digit)=600)
 same => n,Set(TIMEOUT(response)=600)
 same => n,WaitExten()

; ---- Press 1: Play room info ----
exten => 1,1,NoOp(User pressed 1 for room info)
 same => n,StopMusicOnHold()
 same => n,Playback(room_info)
 same => n,StartMusicOnHold(default)
 same => n,Goto(from-twilio,+18669750444,5)


; ---- Press 2: Play internship info ----
exten => 2,1,NoOp(User pressed 2 for internship info)
 same => n,StopMusicOnHold()
 same => n,Playback(internship_info)
 same => n,StartMusicOnHold(default)
 same => n,Goto(from-twilio,+18669750444,5)


; ---- Press 3: Play leetcode placeholder ----
exten => 3,1,NoOp(User pressed 3 for leetcode placeholder)
 same => n,StopMusicOnHold()
 same => n,System(/usr/bin/python /etc/asterisk/sce_phone_menu_handler.py leetcode)
 same => n,Playback(leetcode)
 same => n,StartMusicOnHold(default)
 same => n,Goto(from-twilio,+18669750444,5)


; ---- Press 4: Original phone_stats logic ----
exten => 4,1,NoOp(User pressed 4 for phone_stats)
 same => n,StopMusicOnHold()
 same => n,System(/usr/bin/python /etc/asterisk/sce_phone_menu_handler.py phone_stats)
 same => n,Playback(phone_stats)
 same => n,StartMusicOnHold(default)
 same => n,Goto(from-twilio,+18669750444,5)


; ---- Press 7: Play original greeting ----
exten => 7,1,NoOp(User pressed 7 for original greeting)
 same => n,StopMusicOnHold()
 same => n,Playback(leetcode_placeholder)
 same => n,StartMusicOnHold(default)
 same => n,Goto(from-twilio,+18669750444,5)

; ---- Invalid entry handler ----
exten => i,1,NoOp(Invalid option pressed)
 same => n,StopMusicOnHold()
 same => n,Goto(from-twilio,+18669750444,1)
